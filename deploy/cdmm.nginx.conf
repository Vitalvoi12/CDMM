# HTTPS reaches nginx through the existing Xray listener on port 443.
server {
    listen 80;
    listen [::]:80;
    server_name cdmm.vitalvoi.beer;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://cdmm.vitalvoi.beer$request_uri;
    }
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name cdmm.vitalvoi.beer;

    ssl_certificate /etc/letsencrypt/live/cdmm.vitalvoi.beer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdmm.vitalvoi.beer/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
