services:
  cdmm:
    image: ghcr.io/vitalvoi12/cdmm:latest
    pull_policy: always
    container_name: cdmm
    restart: unless-stopped
    expose:
      - "5173"
    volumes:
      # SQLite database lives here — back it up by copying ./data/cdmm.db
      - ./data:/app/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - cdmm